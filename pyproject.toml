[project]
name = "ccbtag"
version = "0.1.0"
description = "Local Gradio image caption editor with tag and natural-language sections."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=4.44",
    "huggingface-hub>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.optional-dependencies]
models = [
    "dghs-imgutils>=0.19.0",
    "modelscope>=1.17",
    "onnxruntime>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
