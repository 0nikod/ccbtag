[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ccbtag"
version = "0.1.0"
description = "Local Gradio image caption editor with tag and natural-language sections."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=4.44",
    "huggingface-hub>=0.27",
    "numpy>=1.26",
    "onnxruntime-gpu[cuda,cudnn]>=1.26.0",
    "openai>=1.0",
    "pillow>=10.4",
    "modelscope>=1.17",
]

[project.scripts]
ccbtag = "app.app:main"
ccbtag-download-models = "app.cli:download_models_main"

[dependency-groups]
dev = ["pre-commit>=4.6.0", "pytest>=8.0", "ruff>=0.15.13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
